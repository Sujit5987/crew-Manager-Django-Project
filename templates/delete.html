<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .btn1
        {
            width:100px;
            height:50px;
            background-color: brown;
        }
    </style>
</head>
<body>
    <h1><center>Employee LIST</center></h1>
    <div class="table">
      <table class="table">
        <thead>
          <tr>
            <th scope="col">s.no</th>
            <th scope="col">E name</th>
            <th scope="col">E age</th>
            <th scope="col">E dateofbirth</th>
            <th scope="col">E education</th>
            <th scope="col">E type</th>
            <th scope="col">E image</th>
            <th scope="col">E action</th>
          </tr>
        </thead>
        <tbody>
            
            {%for i in employees%}
          <tr>
            <th scope="row">{{forloop.counter}}</th>
            <td>{{i.ename}}</td>
            <td>{{i.eage}}</td>
            <td>{{i.edateofbirth}}</td>
            <td>{{i.eeducation}}</td>
            <td>{{i.etype}}</td>
            <td></td>
            <td>
                <img src="/media/{{i.eimage}}" width="200px">
            </td>  
            <td>
<a href="/delete/{{i.id}}/" class="btn1">Delete</a>
            </td>  
          </tr>
        </tbody>
        {%endfor%}
      </table>
    </div>
</body>
</html>
