        table {
            width: 100%;
            border-collapse: collapse;
        }

        /* Style for table header */
        th {
            background-color: #f2f2f2;
            border: 1px solid #ddd; 
            padding: 10px;
            text-align: left;
        }

        /* Style for table rows */
        td {
            border: 1px solid #ddd; 
            padding: 10px;
            text-align: left;
        }

        
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        /* Optional: Add hover effect */
        tr:hover {
            background-color: #f1f1f1;
        }

        /* Style for action buttons */
        .btn1 {
            display: inline-block;
            padding: 5px 10px;
            background-color:red;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 5px;
        }
        .btn2 {
            display: inline-block;
            padding: 5px 10px;
            background-color:#45a049;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 5px;
        }

        .btn1:hover, .btn2:hover {
          transition: 2s;
            background-color:red;
        }
    </style>
</head>
<body>
    <h1><center>Employee LIST</center></h1>
    <div class="table">
      <table class="table">
        <thead>
          <tr>
            <th scope="col">s.no</th>

            <th scope="col">Domain</th>
            <th scope="col">Image</th>
            <th scope="col">Action</th>
            <th scope="col">Action</th>
          </tr>
        </thead>
        <tbody>
            
            {%for i in employees%}
          <tr>
            <th scope="row">{{forloop.counter}}</th>
            <td>{{i.ename}}</td>
            <td>{{i.eage}}</td>
            <td>{{i.edateofbirth}}</td>
            <td>{{i.eeducation}}</td>
            <td>{{i.etype}}</td>
            <td><img src="/media/{{i.eimage}}" width="100px"></td>   
            <td>
              <div class="btn1"><a href="/delete/{{i.id}}/" class="btn1"><center>Delete</center></a></div>
          </td> 
          <td>
            <div class="btn2"><a href="/update/{{i.id}}/" class="btn2"><center>Update</center></a></div>
        </td> 
          </tr>
        </tbody>
        {%endfor%}
