<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    body{
  background-image: linear-gradient( 600.7deg,  rgb(188, 105, 175) 1.1%, rgba(22,0,98,1) 99% ););
    }
    .navbar{
        font-size: 28px;
        font-weight: bold;
        color: #fff;
        background-color: #3498db;
        text-align: center;
        padding: 20px;
        width: 100%;
        border:1px solid #2c3e50;
        box-shadow:inset 0 4px 6px rgba(0, 0, 0, 0.1);
        border-radius:10px;
    }

    
   
    /* Main container styling */
    .container {
        margin-top:5px;
        margin-left: 390px;
        background-image:linear-gradient(to right,#16222A,#3A6073);
        background-color: #fff;
        padding: 40px;
        border-radius: 12px;
        width: 400px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        transition: box-shadow 0.3s ease;
    }

    .container:hover {
        transform:scaleZ(20%);
        box-shadow: 0 60px 150px rgba(0, 0, 0, 0.2);
    }

    .container h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #2c3e50;
        font-size: 24px;
    }

    /* Label styling */
    label {
        top:0px;
        display: block;
        margin-bottom: 2px;
        font-size: 14px;
        color:#3498db;
        font-weight: bold;
    }

    /* Input field styling */
    input[type="text"], input[type="date"], input[type="file"] {
        color:#fff;
        width: 100%;
        padding: 10px;
        margin-bottom: 20px;
        border: 1px solid #ddd;
        background: transparent;
        border-radius: 8px;
        box-sizing: border-box;
        transition: border-color 0.3s ease;
    }

    input[type="text"]:focus, input[type="date"]:focus, input[type="file"]:focus {
        border-color: #3498db;
        outline: none;
    }

    /* Submit button styling */
    .button {
        background-color: #3498db;
        color: white;
        padding: 12px 0;
        width: 100%;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }

    .button:hover {
        background-color: #2980b9;
    }

    /* Responsive design */
    @media (max-width: 600px) {
        .container {
            width: 90%;
        }
    }
    </style>
</head>
<body>
    <div class="navbar"><center>Update Employee Details Here</center></div>
    <div class="main">
        <form method="POST" enctype="multipart/form-data"> 
            {% csrf_token %}
            <div class="container"><center>
                <label>Employee Name</label>
                <input type="text" name="ename" class="text" placeholder="ename" value="{{employees.ename}}">
                <br>
                <label>Age</label>
                <input type="text" class="text" name="eage" placeholder="eage" value="{{employees.eage}}">
                <br>
                <label>Date of birth</label>
                <input type="date" name="edateofbirth" placeholder="YYYY-MM-DD" value="{{employees.edateofbirth|date:'Y-m-d'}}">
                <br>
                <label>Education</label>
                <input type="text" class="text" value="{{employees.eeducation}}" name="eeducation" placeholder="eeducation">
                <br>
                <label>Domain</labe>
                <input type="text" class="text" name="etype" placeholder="etype" value="{{employees.etype}}">
                <br>
                <label for="receipe_image">Image</label>
                <input type="file" class="file" name="eimage" placeholder="eimage">
                <br>
                <button class="button">SUBMIT</button>
    
            </center></div>
        </form>
        {{c}}
    </div>      
</body>
</html>
